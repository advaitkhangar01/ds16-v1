# scripts/nginx_ds16.conf
# Nginx Configuration Template for DS16 CRM
#
# DEPLOY NOTE: After editing this file, copy to VPS and reload:
#   sudo cp nginx_ds16.conf /etc/nginx/sites-available/ds16
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name crm.designstudio16.co.in;

    # -------------------------------------------------------------------------
    # Upload size limit — must be >= multer MAX_FILE_SIZE (200 MB)
    # Required for: CAD files (.dwg/.rvt/.ifc), ZIP bundles, plotting exports,
    # BOQ spreadsheets, and sanction drawing packages.
    # -------------------------------------------------------------------------
    client_max_body_size 250M;

    # API proxy -> Node on 3001
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads (CAD/ZIP can take time on slow links)
        proxy_read_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;

        # Buffer settings — disable buffering for streaming uploads
        proxy_request_buffering off;
    }

    # Static file serving for uploaded documents
    # Files are served directly by Nginx (faster than proxying through Node)
    location /uploads/ {
        alias /var/www/ds16-final-version/server/uploads/;

        # Prevent execution of uploaded files — serve as download only
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";

        # Disable directory listing
        autoindex off;

        # Cache static uploads for 7 days
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # All other requests -> Node (serves React SPA)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# After setup, run: certbot --nginx -d crm.designstudio16.co.in
